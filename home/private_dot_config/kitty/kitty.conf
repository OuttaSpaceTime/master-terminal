# BEGIN_KITTY_THEME
# Catppuccin Latte
include current-theme.conf
# END_KITTY_THEME

font_size 9.0

# Higher-contrast tab colors
active_tab_background #74c7ec
active_tab_foreground #11131a
inactive_tab_background #e2e4ea
inactive_tab_foreground #6c6f85
tab_bar_background #e2e4ea

font_family      family="JetBrainsMono Nerd Font" style="SemiBold"
bold_font        family="JetBrainsMono Nerd Font" style="ExtraBold"
italic_font      family="JetBrainsMono Nerd Font" style="SemiBold Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="ExtraBold Italic"
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled no-title no-cursor
# Show kitty's real tab title so restored/manual session titles appear in the tab bar.
# `no-title` keeps shell integration from rewriting titles based on the foreground command.
tab_title_template "{title}"
tab_bar_edge left
tab_bar_style custom
tab_title_max_length 24
tab_title_max_lines 2
tab_title_wrap yes
copy_on_select yes
# Strip trailing whitespace from copied selections so pasted commands don't
# get extra line breaks from terminal line-wrapping.
strip_trailing_spaces smart
paste_actions quote-urls-at-prompt
focus_follows_mouse yes
mouse_hide_wait 3
# Kinetic (inertial/momentum) scrolling for touchpads on Wayland.
# Friction 0..1: higher = longer glide. (No effect on macOS, which uses native momentum.)
momentum_scroll 0.96
confirm_os_window_close -1
# Disable all tab/window dragging so tabs can't be dragged into new OS windows
drag_threshold 0
inactive_text_alpha 0.92
dim_opacity 0.85
window_padding_width 6
enabled_layouts splits,fat,grid,horizontal,stack,tall,vertical

# Make new windows/splits inherit the active window's working directory.
map ctrl+shift+enter launch --cwd=oldest
map ctrl+shift+t launch --type=tab --cwd=oldest
map ctrl+shift+d launch --cwd=oldest --location=vsplit
map ctrl+shift+s launch --cwd=oldest --location=hsplit
# Send a distinct CSI-u sequence for Ctrl+Enter so zsh can bind it
# (e.g. zsh-autosuggestions accept). Enter alone is unchanged.
map ctrl+enter send_text all \x1b[13;5u
map ctrl+shift+e kitten hints --hints-foreground-color #ffffff
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map ctrl+alt+shift+h move_window left
map ctrl+alt+shift+j move_window down
map ctrl+alt+shift+k move_window up
map ctrl+alt+shift+l move_window right
map alt+shift+n move_window_forward
map alt+shift+p move_window_backward
map super+alt+h layout_action move_to_screen_edge left
map super+alt+j layout_action move_to_screen_edge bottom
map super+alt+k layout_action move_to_screen_edge top
map super+alt+l layout_action move_to_screen_edge right
map super+alt+r layout_action rotate
map ctrl+alt+k clear_terminal clear active
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l
map --when-focus-on title:^herdr: ctrl+h
map --when-focus-on title:^herdr: ctrl+j
map --when-focus-on title:^herdr: ctrl+k
map --when-focus-on title:^herdr: ctrl+l
map shift+alt+up remote_control scroll-window 0.5p-
map shift+alt+down remote_control scroll-window 0.5p
map alt+h kitten relative_resize.py left 3
map alt+j kitten relative_resize.py down 3
map alt+k kitten relative_resize.py up 3
map alt+l kitten relative_resize.py right 3
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l
# Let nvim see ctrl+tab / ctrl+shift+tab (trackball tab-switch gesture)
map --when-focus-on var:IS_NVIM ctrl+tab
map --when-focus-on var:IS_NVIM ctrl+shift+tab
map ctrl+alt+h previous_tab
map ctrl+alt+l next_tab
map ctrl+alt+shift+right remote_control load-config -o tab_title_max_length=35
map ctrl+alt+shift+left  remote_control load-config -o tab_title_max_length=20
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+f2 detach_window tab-prev
map ctrl+f3 detach_window new-tab
map ctrl+f4 detach_window ask
map f6 toggle_layout stack
map f7 save_as_session --use-foreground-process --save-only --base-dir ~/.local/share/kitty/sessions
map f8 combine : close_other_os_windows : close_other_tabs_in_os_window : goto_session ~/.local/share/kitty/sessions

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/home/felix/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Inside herdr, hand kitty's split/tab keys to herdr; it binds the same keys to its panes, tabs and workspaces.
map --when-focus-on title:^herdr: ctrl+1
map --when-focus-on title:^herdr: ctrl+2
map --when-focus-on title:^herdr: ctrl+3
map --when-focus-on title:^herdr: ctrl+4
map --when-focus-on title:^herdr: ctrl+5
map --when-focus-on title:^herdr: ctrl+6
map --when-focus-on title:^herdr: ctrl+7
map --when-focus-on title:^herdr: ctrl+8
map --when-focus-on title:^herdr: ctrl+9
map --when-focus-on title:^herdr: ctrl+alt+h
map --when-focus-on title:^herdr: ctrl+alt+l
map --when-focus-on title:^herdr: ctrl+shift+t
map --when-focus-on title:^herdr: ctrl+shift+q
map --when-focus-on title:^herdr: ctrl+alt+shift+t
map --when-focus-on title:^herdr: ctrl+shift+g
map --when-focus-on title:^herdr: ctrl+shift+o
map --when-focus-on title:^herdr: ctrl+shift+x
map --when-focus-on title:^herdr: ctrl+shift+h
map --when-focus-on title:^herdr: ctrl+shift+l
map --when-focus-on title:^herdr: ctrl+shift+n
map --when-focus-on title:^herdr: ctrl+shift+m
map --when-focus-on title:^herdr: ctrl+shift+d
map --when-focus-on title:^herdr: ctrl+shift+enter
map --when-focus-on title:^herdr: ctrl+shift+s
map --when-focus-on title:^herdr: ctrl+shift+w
map --when-focus-on title:^herdr: ctrl+alt+shift+h
map --when-focus-on title:^herdr: ctrl+alt+shift+j
map --when-focus-on title:^herdr: ctrl+alt+shift+k
map --when-focus-on title:^herdr: ctrl+alt+shift+l
map --when-focus-on title:^herdr: alt+h
map --when-focus-on title:^herdr: alt+j
map --when-focus-on title:^herdr: alt+k
map --when-focus-on title:^herdr: alt+l
map --when-focus-on title:^herdr: alt+shift+h
map --when-focus-on title:^herdr: alt+shift+l
map --when-focus-on title:^herdr: ctrl+shift+[
map --when-focus-on title:^herdr: ctrl+shift+]
map --when-focus-on title:^herdr: f6
map --when-focus-on title:^herdr: ctrl+shift+r
map --when-focus-on title:^herdr: ctrl+shift+b
map --when-focus-on title:^herdr: ctrl+shift+f

# Cheat sheet for the herdr keys above (q closes it).
map ctrl+alt+? launch --type=overlay less /home/felix/.config/kitty/herdr-keys.txt
